<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>키오스캔 (KioScan)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #f0f4f8;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 {
    color: #1565c0;
    margin: 20px 0 10px;
    font-size: 28px;
  }
  .subtitle {
    color: #555;
    font-size: 18px;
    text-align: center;
    margin-bottom: 30px;
  }
  .container {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  video, canvas, img.preview {
    width: 100%;
    border-radius: 12px;
    background: #000;
  }
  canvas { display: none; }
  button {
    width: 100%;
    padding: 18px;
    font-size: 22px;
    font-weight: bold;
    border: none;
    border-radius: 12px;
    background: #1565c0;
    color: white;
    cursor: pointer;
  }
  button:disabled {
    background: #aaa;
  }
  button.secondary {
    background: #fff;
    color: #1565c0;
    border: 2px solid #1565c0;
  }
  .result-box {
    background: #e3f2fd;
    border-radius: 12px;
    padding: 20px;
    font-size: 22px;
    line-height: 1.6;
    min-height: 80px;
    white-space: pre-wrap;
  }
  .loading {
    text-align: center;
    font-size: 20px;
    color: #1565c0;
    padding: 30px 0;
  }
  .error {
    color: #c62828;
  }
  .hidden { display: none; }
  .settings {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    font-size: 16px;
  }
  .settings label { display: block; margin-bottom: 6px; color: #333; }
  .settings input {
    width: 100%;
    padding: 10px;
    font-size: 16px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
</style>
</head>
<body>

<h1>키오스캔 (KioScan)</h1>
<p class="subtitle">키오스크 화면을 비추면<br>AI가 친절하게 알려드려요</p>

<div class="container">

  <!-- 카메라 화면 -->
  <video id="video" autoplay playsinline class="hidden"></video>
  <canvas id="canvas"></canvas>
  <img id="preview" class="preview hidden">

  <button id="startBtn">화면 비추기 (카메라 켜기)</button>
  <button id="captureBtn" class="hidden">촬영하기</button>

  <!-- 결과 영역 -->
  <div id="loading" class="loading hidden">AI가 화면을 살펴보고 있어요...</div>
  <div id="resultBox" class="result-box hidden"></div>

  <button id="speakBtn" class="secondary hidden">다시 듣기</button>
  <button id="retryBtn" class="secondary hidden">다시 촬영하기</button>

</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const preview = document.getElementById('preview');
const startBtn = document.getElementById('startBtn');
const captureBtn = document.getElementById('captureBtn');
const loading = document.getElementById('loading');
const resultBox = document.getElementById('resultBox');
const speakBtn = document.getElementById('speakBtn');
const retryBtn = document.getElementById('retryBtn');
const OPENROUTER_API_KEY = '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';

// 시스템 프롬프트
const SYSTEM_PROMPT = `당신은 키오스크 사용이 어려운 노약자를 돕는 AI 도우미입니다.
사진 속 키오스크 화면을 보고 다음 형식으로 답변하세요:

1. 현재 화면이 무엇을 위한 화면인지 한 문장으로 설명하세요.
2. 다음에 눌러야 할 버튼의 위치와 모양을 쉽게 설명하세요.
   (예: "화면 오른쪽 아래에 있는 초록색 '결제하기' 버튼을 눌러주세요.")
3. 어려운 용어가 있다면 쉬운 말로 풀어서 설명하세요.
4. 문장은 짧고 친절한 존댓말로 작성하세요.
5. 전체 답변은 4~5문장 이내로 간결하게 작성하세요.`;

// 카메라 시작
startBtn.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' } // 후면 카메라
    });
    video.srcObject = stream;
    video.classList.remove('hidden');
    startBtn.classList.add('hidden');
    captureBtn.classList.remove('hidden');
    preview.classList.add('hidden');
    resultBox.classList.add('hidden');
    speakBtn.classList.add('hidden');
    retryBtn.classList.add('hidden');
  } catch (err) {
    alert('카메라를 사용할 수 없습니다: ' + err.message);
  }
});

// 촬영
captureBtn.addEventListener('click', () => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // 미리보기 표시
  const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
  preview.src = dataUrl;
  preview.classList.remove('hidden');

  // 카메라 정지
  stream.getTracks().forEach(track => track.stop());
  video.classList.add('hidden');
  captureBtn.classList.add('hidden');

  analyzeImage(dataUrl);
});

// AI 분석 요청
async function analyzeImage(dataUrl) {
  loading.classList.remove('hidden');
  resultBox.classList.add('hidden');
  speakBtn.classList.add('hidden');
  retryBtn.classList.add('hidden');

  const base64Data = dataUrl.split(',')[1];

  try {
    const response = await fetch(
      'https://openrouter.ai/api/v1/chat/completions',
      {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${OPENROUTER_API_KEY}`
        },
        body: JSON.stringify({
          model: 'meta-llama/llama-4-maverick:free',
          messages: [
            {
              role: 'user',
              content: [
                { type: 'text', text: SYSTEM_PROMPT + "\n\n이 키오스크 화면을 설명해주세요." },
                { type: 'image_url', image_url: { url: dataUrl } }
              ]
            }
          ]
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error?.message || '알 수 없는 오류');
    }

    const text = data.choices?.[0]?.message?.content;
    if (!text) throw new Error('AI 응답을 받지 못했습니다.');

    lastResultText = text;
    resultBox.textContent = text;
    resultBox.classList.remove('hidden', 'error');
    speakBtn.classList.remove('hidden');
    retryBtn.classList.remove('hidden');

    speak(text);

  } catch (err) {
    resultBox.textContent = '오류가 발생했습니다: ' + err.message;
    resultBox.classList.remove('hidden');
    resultBox.classList.add('error');
    retryBtn.classList.remove('hidden');
  } finally {
    loading.classList.add('hidden');
  }
}

// 음성 출력 (TTS)
function speak(text) {
  if (!('speechSynthesis' in window)) {
    alert('이 브라우저는 음성 출력을 지원하지 않습니다.');
    return;
  }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ko-KR';
  utter.rate = 0.9;
  speechSynthesis.speak(utter);
}

speakBtn.addEventListener('click', () => speak(lastResultText));

// 다시 촬영하기
retryBtn.addEventListener('click', () => {
  preview.classList.add('hidden');
  resultBox.classList.add('hidden');
  speakBtn.classList.add('hidden');
  retryBtn.classList.add('hidden');
  startBtn.classList.remove('hidden');
});
</script>

</body>
</html>
