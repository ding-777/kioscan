<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키오스캔 (KioScan)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5; text-align: center; }
        h1 { color: #333; font-size: 2.5rem; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #camera-view, #captured-image { width: 100%; max-height: 400px; border-radius: 10px; display: none; margin-bottom: 20px; object-fit: contain; background: #000; }
        button { background-color: #007bff; color: white; border: none; padding: 20px 40px; font-size: 1.5rem; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:active { transform: scale(0.98); }
        #capture-btn { background-color: #28a745; display: none; }
        #result-box { margin-top: 20px; padding: 20px; background: #e9ecef; border-radius: 10px; font-size: 1.3rem; line-height: 1.6; text-align: left; min-height: 100px; white-space: pre-wrap; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>👀 키오스캔</h1>
    <p style="font-size: 1.2rem; color: #666;">카메라로 키오스크를 비추면 구글 Gemini AI가 설명해 드립니다.</p>
    
    <video id="camera-view" autoplay playsinline></video>
    <img id="captured-image" alt="단말기 캡처 화면">
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <button id="start-btn" onclick="startCamera()">📷 화면 비추기 시작</button>
    <button id="capture-btn" onclick="captureAndAnalyze()">🔍 이 화면 분석하기</button>
    
    <div id="result-box">아래 버튼을 눌러 카메라를 켜고 키오스크를 촬영해 주세요.</div>
</div>

<script>
    const GEMINI_API_KEY = "AQ.Ab8RN6LMYkuEtq9D3et7Tacx0zmQkWpruMbv0aNItNhilzbgng";
    
    let streamRef = null;
    const video = document.getElementById('camera-view');
    const img = document.getElementById('captured-image');
    const canvas = document.getElementById('hidden-canvas');
    const resultBox = document.getElementById('result-box');
    const startBtn = document.getElementById('start-btn');
    const captureBtn = document.getElementById('capture-btn');

    async function startCamera() {
        try {
            window.speechSynthesis.cancel(); // 카메라 리셋 시 이전 음성 강제 종료
            resultBox.innerHTML = "카메라 장치를 연결하는 중입니다...";
            
            // 모바일 후면 카메라 호환성을 높인 표준 가이드라인 세팅
            const constraints = {
                video: {
                    facingMode: "environment", 
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            };

            streamRef = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = streamRef;
            video.setAttribute("playsinline", true); // 모바일 전체화면 튕김 방지
            video.style.display = "block";
            img.style.display = "none";
            startBtn.style.display = "none";
            captureBtn.style.display = "block";
            resultBox.innerHTML = "키오스크 화면을 조준하고 '이 화면 분석하기'를 눌러주세요.";
        } catch (err) {
            console.error(err);
            resultBox.innerHTML = "❌ 카메라를 켤 수 없습니다.<br>원인: " + err.name + "<br>주소창 왼쪽 자물쇠(🔒) 아이콘을 눌러 카메라 권한을 '허용'해 주세요.";
        }
    }

    async function captureAndAnalyze() {
        if (!streamRef) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg');
        const base64Data = dataUrl.split(',')[1]; 
        
        img.src = dataUrl;
        img.style.display = "block";
        video.style.display = "none";
        captureBtn.style.display = "none";
        startBtn.style.display = "block";
        
        // 다시 촬영하기를 누르는 순간 기존 음성 안내 즉시 차단
        window.speechSynthesis.cancel(); 
        startBtn.innerText = "🔄 다시 촬영하기";

        resultBox.innerHTML = "<span class='loading'>구글 제미나이 AI가 키오스크를 분석 중입니다...</span>";

        // AI 행동 수칙 세팅 ("눌러주세요" 차단 및 "고르거나 말해주세요" 포맷 강제)
        const instruction = "당신은 키오스크 사용이 어려운 고령층과 노약자를 돕는 특화 AI 도우미입니다. 제출된 키오스크 화면 이미지를 정밀 분석하여 다음 규칙에 따라 응답하세요:\n" +
                            "1. [절대 금지 규칙] '누르세요', '눌러주세요', '터치하세요', '클릭하세요' 라는 물리적인 접촉 단어는 어떤 상황에서도 절대로 사용해서는 안 됩니다.\n" +
                            "2. [필수 문장 형식] 사용자가 다음에 취해야 할 행동을 가이드할 때, 반드시 [화면 오른쪽 아래에 있는 초록색 '주문하기' 버튼을 고르거나 메뉴를 말해주세요] 또는 [원하시는 메뉴를 화면에서 고르거나 큰 소리로 말해주세요]와 같은 형태로 \"~를 고르거나 말해주세요\"라는 표현을 필수로 포함하여 설명하세요.\n" +
                            "3. 현재 어떤 단계의 화면인지 친절하게 한 문장으로 요약해서 첫머리에 배치하세요.\n" +
                            "4. 화면 속의 어려운 영어나 한자어, 전문 용어는 노약자가 이해하기 쉬운 우리말로 풀어서 안내하고, 반드시 짧고 명확한 호흡의 존댓말로 작성하세요.";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: instruction },
                            { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                        ]
                    }]
                })
            });

            const result = await response.json();
            
            if (result.candidates && result.candidates[0].content.parts[0].text) {
                const aiText = result.candidates[0].content.parts[0].text;
                resultBox.innerHTML = aiText;
                speak(aiText); // 분석 데이터 음성 가공 함수 호출
            } else {
                resultBox.innerHTML = "❌ 제미나이가 화면을 보았으나 안내 문구를 생성하지 못했습니다. 다시 촬영해 주세요.";
            }
        } catch (error) {
            resultBox.innerHTML = "❌ 구글 서버 연결 실패. 잠시 후 다시 시도해 주세요.";
        }
    }

    // 오디오 출력 및 기계음(이모지, 특수문자) 자동 제거 필터
    function speak(text) {
        window.speechSynthesis.cancel();
        
        // 듣기 싫은 특수 기호나 이모지 필터링 로직
        let cleanText = text.replace(/[^ㄱ-ㅎㅏ-ㅣ가-힣a-zA-Z0-9.\,\?\!\s]/g, "").trim();
        
        const speech = new SpeechSynthesisUtterance(cleanText);
        speech.lang = 'ko-KR';
        speech.rate = 0.95; // 노약자 전용 살짝 느린 속도 세팅
        window.speechSynthesis.speak(speech);
    }
</script>

</body>
</html>
