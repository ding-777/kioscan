<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키오스캔 (KioScan)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5; text-align: center; }
        h1 { color: #333; font-size: 2.5rem; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #camera-view, #captured-image { width: 100%; max-height: 400px; border-radius: 10px; display: none; margin-bottom: 20px; object-fit: contain; background: #000; }
        button { background-color: #007bff; color: white; border: none; padding: 20px 40px; font-size: 1.5rem; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:active { transform: scale(0.98); }
        #capture-btn { background-color: #28a745; display: none; }
        #result-box { margin-top: 20px; padding: 20px; background: #e9ecef; border-radius: 10px; font-size: 1.3rem; line-height: 1.6; text-align: left; min-height: 100px; white-space: pre-wrap; }
        #stt-box { margin-top: 15px; padding: 15px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 10px; font-size: 1.2rem; font-weight: bold; color: #856404; display: none; text-align: center; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>👀 키오스캔 (보이스 모드)</h1>
    <p style="font-size: 1.2rem; color: #666;">카메라로 촬영 후, AI의 안내에 따라 말로 주문할 수 있습니다.</p>
    
    <video id="camera-view" autoplay playsinline></video>
    <img id="captured-image" alt="단말기 캡처 화면">
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <button id="start-btn" onclick="startCamera()">📷 화면 비추기 시작</button>
    <button id="capture-btn" onclick="captureAndAnalyze()">🔍 이 화면 분석하기</button>
    
    <div id="stt-box">🎙️ 말씀해 주세요... (듣는 중)</div>
    <div id="result-box">아래 버튼을 눌러 카메라를 켜고 키오스크를 촬영해 주세요.</div>
</div>

<script>
    const GEMINI_API_KEY = "AQ.Ab8RN6LMYkuEtq9D3et7Tacx0zmQkWpruMbv0aNItNhilzbgng";
    
    let streamRef = null;
    let recognition = null;
    const video = document.getElementById('camera-view');
    const img = document.getElementById('captured-image');
    const canvas = document.getElementById('hidden-canvas');
    const resultBox = document.getElementById('result-box');
    const sttBox = document.getElementById('stt-box');
    const startBtn = document.getElementById('start-btn');
    const captureBtn = document.getElementById('capture-btn');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.lang = 'ko-KR';
        recognition.interimResults = false;

        recognition.onstart = () => {
            sttBox.style.display = "block";
            sttBox.innerHTML = "🎙️ 말씀해 주세요... (음성 제어 듣는 중)";
        };

        recognition.onresult = (event) => {
            const userSpeech = event.results[0][0].transcript;
            sttBox.innerHTML = `📢 인식된 명령: "${userSpeech}"`;
            resultBox.innerHTML += `\n\n[보이스 제어 수신 데이터]: "${userSpeech}" 명령을 분석하여 로봇 제어 모듈로 전송합니다.`;
        };

        recognition.onend = () => {
            setTimeout(() => { sttBox.style.display = "none"; }, 5000);
        };

        recognition.onerror = () => {
            sttBox.innerHTML = "❌ 음성을 인식하지 못했습니다. 다시 시도해 주세요.";
        };
    }

    async function startCamera() {
        try {
            stopAllSpeechAndRec();
            resultBox.innerHTML = "카메라를 연결하는 중입니다...";
            streamRef = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: { ideal: "environment" } }, 
                audio: false 
            });
            video.srcObject = streamRef;
            video.style.display = "block";
            img.style.display = "none";
            startBtn.style.display = "none";
            captureBtn.style.display = "block";
            resultBox.innerHTML = "키오스크 화면을 조준하고 '이 화면 분석하기'를 눌러주세요.";
        } catch (err) {
            resultBox.innerHTML = "❌ 카메라를 켤 수 없습니다. 권한 허용을 확인해 주세요.";
        }
    }

    async function captureAndAnalyze() {
        if (!streamRef) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg');
        const base64Data = dataUrl.split(',')[1]; 
        
        img.src = dataUrl;
        img.style.display = "block";
        video.style.display = "none";
        captureBtn.style.display = "none";
        startBtn.style.display = "block";
        
        stopAllSpeechAndRec();
        startBtn.innerText = "🔄 다시 촬영하기";

        resultBox.innerHTML = "<span class='loading'>구글 제미나이 AI가 보이스 어시스턴트 모드로 키오스크를 분석 중입니다...</span>";

        // 🔥 [프롬프트 극강 보완] "누르세요", "클릭하세요"를 금지하고 무조건 말하라고 강제 세팅함
        const instruction = "당신은 키오스크 사용이 어려운 시각 장애인 및 고령층을 돕는 보이스 어시스턴트 특화 AI입니다. 제출된 이미지를 분석하여 다음 규칙을 생명을 다해 절대적으로 지켜 응답하세요:\n" +
                            "1. [절대 금지 규칙] '누르세요', '눌러주세요', '터치하세요', '클릭하세요' 라는 단어는 어떤 상황에서도 절대로 사용해서는 안 됩니다. 이 단어들을 사용하면 시스템 오류가 발생합니다.\n" +
                            "2. [필수 문장 형식] 사용자가 다음 행동을 해야 할 때는 무조건 '~를 고르거나 메뉴를 말해주세요' 또는 '~를 화면에서 선택하거나 큰 소리로 말해주세요' 라는 표현으로만 문장을 끝맺으세요.\n" +
                            "   - 잘못된 예: '오른쪽 아래에 있는 주문하기 버튼을 누르세요.' (X)\n" +
                            "   - 올바른 예: '화면 오른쪽 아래에 있는 초록색 주문하기 버튼을 고르거나 메뉴를 말해주세요.' (O)\n" +
                            "3. 현재 화면이 어떤 단계(예: 메뉴 선택 화면, 장바구니 확인 화면 등)인지 맨 앞에 친절하게 한 문장으로 요약한 뒤, 위 2번 규칙에 맞춰 행동 가이드를 주세요.\n" +
                            "4. 정중하고 명확한 호흡의 높임말로 답변을 생성하세요.";

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: instruction },
                            { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                        ]
                    }]
                })
            });

            const result = await response.json();
            
            if (result.candidates && result.candidates[0].content.parts[0].text) {
                const aiText = result.candidates[0].content.parts[0].text;
                resultBox.innerHTML = aiText;
                speak(aiText);
            } else {
                resultBox.innerHTML = "❌ AI가 화면 안내 문구를 생성하지 못했습니다. 다시 촬영해 주세요.";
            }
        } catch (error) {
            resultBox.innerHTML = "❌ 구글 서버 연결 실패. 네트워크 상태를 확인해 주세요.";
        }
    }

    function speak(text) {
        stopAllSpeechAndRec();
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'ko-KR';
        speech.rate = 0.95;

        speech.onend = () => {
            if (recognition) {
                recognition.start();
            }
        };

        window.speechSynthesis.speak(speech);
    }

    function stopAllSpeechAndRec() {
        window.speechSynthesis.cancel();
        if (recognition) {
            try { recognition.stop(); } catch(e) {}
        }
        sttBox.style.display = "none";
    }
</script>

</body>
</html>
