<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키오스캔 (KioScan)</title>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            text-align: center;
        }
        h1 {
            color: #333;
            font-size: 2.5rem;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #camera-view {
            width: 100%;
            max-height: 400px;
            border-radius: 10px;
            background: #000;
            display: none;
            margin-bottom: 20px;
        }
        #captured-image {
            width: 100%;
            max-height: 400px;
            border-radius: 10px;
            display: none;
            margin-bottom: 20px;
            object-fit: contain;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active {
            transform: scale(0.98);
        }
        #capture-btn {
            background-color: #28a745;
            display: none;
        }
        #result-box {
            margin-top: 20px;
            padding: 20px;
            background: #e9ecef;
            border-radius: 10px;
            font-size: 1.3rem;
            line-height: 1.6;
            text-align: left;
            min-height: 100px;
            white-space: pre-wrap;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>👀 키오스캔</h1>
    <p style="font-size: 1.2rem; color: #666;">카메라로 키오스크를 비추면 AI가 설명해 드립니다.</p>
    
    <video id="camera-view" autoplay playsinline></video>
    <img id="captured-image" alt="단말기 캡처 화면">
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <button id="start-btn" onclick="startCamera()">📷 화면 비추기 시작</button>
    <button id="capture-btn" onclick="captureAndAnalyze()">🔍 이 화면 분석하기</button>
    
    <div id="result-box">아래 버튼을 눌러 카메라를 켜고 키오스크를 촬영해 주세요.</div>
</div>

<script>
    // 복사해주신 OpenRouter API Key
    const OPENROUTER_API_KEY = "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";
    
    let streamRef = null;
    const video = document.getElementById('camera-view');
    const img = document.getElementById('captured-image');
    const canvas = document.getElementById('hidden-canvas');
    const resultBox = document.getElementById('result-box');
    const startBtn = document.getElementById('start-btn');
    const captureBtn = document.getElementById('capture-btn');

    // 1. 카메라 시작
    async function startCamera() {
        try {
            resultBox.innerHTML = "카메라 권한을 요청 중입니다...";
            streamRef = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" }, 
                audio: false 
            });
            video.srcObject = streamRef;
            video.style.display = "block";
            img.style.display = "none";
            startBtn.style.display = "none";
            captureBtn.style.style.display = "block";
            resultBox.innerHTML = "키오스크 화면이 잘 보이도록 맞추고 '이 화면 분석하기' 버튼을 눌러주세요.";
        } catch (err) {
            console.error(err);
            resultBox.innerHTML = "❌ 카메라를 켤 수 없습니다. 권한을 허용했는지 확인해 주세요. (HTTPS 환경 필수)";
        }
    }

    // 2. 촬영 및 AI 분석 요청
    async function captureAndAnalyze() {
        if (!streamRef) return;

        // 캔버스에 현재 영상 프레임 복사
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        // 데이터 URL 추출 (JPEG)
        const dataUrl = canvas.toDataURL('image/jpeg');
        
        // UI 전환 (비디오 끄고 캡처 이미지 표시)
        img.src = dataUrl;
        img.style.display = "block";
        video.style.display = "none";
        captureBtn.style.display = "none";
        startBtn.style.display = "block";
        startBtn.innerText = "🔄 다시 촬영하기";

        resultBox.innerHTML = "<span class='loading'>인공지능이 키오스크 화면을 분석하고 있습니다. 잠시만 기다려주세요...</span>";

        // AI 프롬프트 정의
        const systemPrompt = "당신은 키오스크 사용이 어려운 고령층과 노약자를 돕는 특화 AI 도우미입니다. 제출된 키오스크 화면 이미지를 정밀 분석하여 다음 규칙에 따라 응답하세요:\n1. 현재 어떤 단계의 화면인지 친절하게 한 문장으로 요약합니다.\n2. 사용자가 목적을 달성하기 위해 '다음에 눌러야 할 버튼의 위치, 이름, 색상'을 매우 구체적으로 설명합니다. (예: 화면 오른쪽 아래에 있는 초록색 '주문하기' 버튼을 누르세요)\n3. 화면 속의 어려운 영어나 한자어, 전문 용어는 노약자가 이해하기 쉬운 우리말로 풀어서 안내합니다.\n4. 반드시 짧고 명확한 호흡의 존댓말로 작성하세요.";

        try {
            // OpenRouter API 호출 (Llama-4 Maverick 무료 비전 모델 사용)
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${OPENROUTER_API_KEY}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "meta-llama/llama-4-maverick:free",
                    messages: [
                        {
                            role: "user",
                            content: [
                                { type: "text", text: systemPrompt },
                                { type: "image_url", image_url: { url: dataUrl } }
                            ]
                        }
                    ]
                })
            });

            const result = await response.json();
            
            if (result.choices && result.choices[0]) {
                const aiText = result.choices[0].message.content;
                resultBox.innerHTML = aiText;
                // 웹 음성 합성(TTS)으로 가이드 읽어주기
                speak(aiText);
            } else {
                console.error(result);
                resultBox.innerHTML = "❌ AI의 응답을 해석하지 못했습니다. 다시 시도해 주세요.";
            }

        } catch (error) {
            console.error(error);
            resultBox.innerHTML = "❌ 분석 중 네트워크 오류가 발생했습니다. 인터넷 연결을 확인해 주세요.";
        }
    }

    // 3. 음성 안내(TTS) 모듈
    function speak(text) {
        // 기존 재생 중인 음성 모두 취소
        window.speechSynthesis.cancel();
        
        const speech = new SpeechSynthesisUtterance(text);
        speech.lang = 'ko-KR';
        speech.rate = 0.9; // 조금 천천히 읽기 (노약자 배려)
        window.speechSynthesis.speak(speech);
    }
</script>

</body>
</html>
