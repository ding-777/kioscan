<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>키오스캔 (KioScan)</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 20px; background-color: #f5f5f5; text-align: center; }
        h1 { color: #333; font-size: 2.5rem; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #camera-view, #captured-image { width: 100%; max-height: 400px; border-radius: 10px; display: none; margin-bottom: 20px; object-fit: contain; background: #000; }
        button { border: none; padding: 20px 40px; font-size: 1.5rem; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        #start-btn { background-color: #007bff; color: white; width: 100%; }
        #capture-btn { background-color: #28a745; color: white; display: none; width: 100%; }
        
        .voice-controls { display: none; margin-bottom: 15px; gap: 10px; width: 100%; }
        #stt-start-btn { background-color: #ffc107; color: #212529; flex: 1; padding: 15px; font-size: 1.2rem; }
        #stt-stop-btn { background-color: #dc3545; color: white; flex: 1; padding: 15px; font-size: 1.2rem; }
        
        #result-box { margin-top: 20px; padding: 20px; background: #e9ecef; border-radius: 10px; font-size: 1.3rem; line-height: 1.6; text-align: left; min-height: 100px; white-space: pre-wrap; }
        #stt-box { margin-top: 15px; padding: 15px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 10px; font-size: 1.2rem; font-weight: bold; color: #856404; display: none; text-align: center; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>👀 키오스캔 (보이스 모드)</h1>
    <p style="font-size: 1.2rem; color: #666;">카메라로 촬영 후, 음성 버튼을 이용해 말로 주문해 주세요.</p>
    
    <video id="camera-view" autoplay playsinline></video>
    <img id="captured-image" alt="단말기 캡처 화면">
    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <button id="start-btn" onclick="startCamera()">📷 화면 비추기 시작</button>
    <button id="capture-btn" onclick="captureAndAnalyze()">🔍 이 화면 분석하기</button>
    
    <div id="voice-btn-area" class="voice-controls">
        <button id="stt-start-btn" onclick="startSpeechRecognition()">🎙️ 음성인식 시작</button>
        <button id="stt-stop-btn" onclick="stopSpeechRecognition()">⏹️ 인식 종료 및 분석</button>
    </div>
    
    <div id="stt-box">🎙️ 말씀해 주세요... (듣는 중)</div>
    <div id="result-box">아래 버튼을 눌러 카메라를 켜고 키오스크를 촬영해 주세요.</div>
</div>

<script>
    const GEMINI_API_KEY = "AQ.Ab8RN6LMYkuEtq9D3et7Tacx0zmQkWpruMbv0aNItNhilzbgng";
    
    let streamRef = null;
    let recognition = null;
    let globalCapturedBase64 = null; 
    let isRecognizing = false;

    const video = document.getElementById('camera-view');
    const img = document.getElementById('captured-image');
    const canvas = document.getElementById('hidden-canvas');
    const resultBox = document.getElementById('result-box');
    const sttBox = document.getElementById('stt-box');
    const startBtn = document.getElementById('start-btn');
    const captureBtn = document.getElementById('capture-btn');
    const voiceArea = document.getElementById('voice-btn-area');

    // 브라우저 STT 설정
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.continuous = true; 
        recognition.lang = 'ko-KR';
        recognition.interimResults = true; 

        recognition.onstart = () => {
            isRecognizing = true;
            sttBox.style.display = "block";
            sttBox.innerHTML = "🎙️ 말씀해 주세요... (음성 수신 중)";
        };

        recognition.onresult = (event) => {
            let currentScript = "";
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                currentScript += event.results[i][0].transcript;
            }
            sttBox.innerHTML = `📢 입력 중: "${currentScript}"`;
        };

        recognition.onend = () => { isRecognizing = false; };
        recognition.onerror = () => { sttBox.innerHTML = "❌ 음성 인식 장치 오류"; };
    }

    function startSpeechRecognition() {
        if (!recognition) {
            alert("크롬 브라우저를 이용해 주세요.");
            return;
        }
        window.speechSynthesis.cancel(); 
        if (!isRecognizing) {
            try { recognition.start(); } catch(e){}
        }
    }

    function stopSpeechRecognition() {
        if (recognition && isRecognizing) { recognition.stop(); }
        
        const finalSpeech = sttBox.innerText.replace('📢 입력 중: ', '').replace('🎙️ 말씀해 주세요... (음성 수신 중)', '').replace(/"/g, '').trim();
        
        if (!finalSpeech || finalSpeech === "" || finalSpeech.includes("오류") || finalSpeech.includes("말씀해")) {
            sttBox.innerHTML = "⚠️ 인식된 음성 명령이 없습니다.";
            return;
        }
        sendVoiceCommandToGemini(finalSpeech);
    }

    async function startCamera() {
        try {
            stopAllSpeechAndRec();
            resultBox.innerHTML = "카메라 장치를 연결하는 중입니다...";
            const constraints = { video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false };
            streamRef = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = streamRef;
            video.setAttribute("playsinline", true); 
            video.style.display = "block";
            img.style.display = "none";
            startBtn.style.display = "none";
            captureBtn.style.display = "block";
            resultBox.innerHTML = "키오스크 화면을 조준하고 '이 화면 분석하기'를 눌러주세요.";
        } catch (err) {
            resultBox.innerHTML = "❌ 카메라를 켤 수 없습니다. 권한을 확인해 주세요.";
        }
    }

    // 1차 사진 분석 파트 (구글 서버 전송 규격 완벽 패치 완료)
    async function captureAndAnalyze() {
        if (!streamRef) return;

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const dataUrl = canvas.toDataURL('image/jpeg');
        globalCapturedBase64 = dataUrl.split(',')[1]; 
        
        img.src = dataUrl;
        img.style.display = "block";
        video.style.display = "none";
        captureBtn.style.display = "none";
        startBtn.style.display = "block";
        
        stopAllSpeechAndRec();
        startBtn.innerText = "🔄 다시 촬영하기";
        voiceArea.style.display = "flex"; 

        resultBox.innerHTML = "<span class='loading'>구글 제미나이 AI가 키오스크 화면을 정밀 분석 중입니다...</span>";

        const instruction = "당신은 키오스크 사용이 어려운 고령층과 노약자를 돕는 특화 AI 도우미입니다. 제출된 키오스크 화면 이미지를 분석하여 다음 규칙을 절대적으로 지켜 응답하세요:\n" +
                            "1. [절대 금지 규칙] '누르세요', '눌러주세요', '터치하세요', '클릭하세요' 라는 단어는 어떤 상황에서도 절대로 사용해서는 안 됩니다.\n" +
                            "2. [필수 문장 형식] 사용자가 다음 행동을 해야 할 때는 무조건 '~를 고르거나 메뉴를 말해주세요' 또는 '~를 화면에서 선택하거나 큰 소리로 말해주세요' 라는 표현으로만 문장을 끝맺으세요.\n" +
                            "3. 현재 화면이 어떤 단계인지 첫 문장으로 명확히 요약하고 가이드하세요.";

        try {
            // 🔥 mime_type과 data 구조를 구글 API 규격에 100% 맞춤 개조
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: instruction },
                            { inlineData: { mimeType: "image/jpeg", data: globalCapturedBase64 } }
                        ]
                    }]
                })
            });

            const result = await response.json();
            if (result.candidates && result.candidates[0].content.parts[0].text) {
                const aiText = result.candidates[0].content.parts[0].text;
                resultBox.innerHTML = aiText;
                speak(aiText);
            } else {
                resultBox.innerHTML = "❌ 이미지를 분석하지 못했습니다. 다시 촬영해 주세요.";
            }
        } catch (error) {
            resultBox.innerHTML = "❌ 구글 서버 연결 실패.";
        }
    }

    // 2차 음성 명령 처리 파트 (전송 규격 완벽 패치 완료)
    async function sendVoiceCommandToGemini(userMessage) {
        if (!globalCapturedBase64) {
            resultBox.innerHTML = "❌ 사진 데이터가 없습니다. 다시 촬영해 주세요.";
            return;
        }

        resultBox.innerHTML = `<span class='loading'>📢 사용자의 명령문 [${userMessage}] 분석 중...</span>`;

        const voiceInstruction = "당신은 사용자의 음성 명령을 듣고 키오스크 화면을 대리 조작하는 하드웨어 제어 연동 AI입니다. 현재 촬영된 키오스크 이미지와 사용자가 말한 명령을 비교 분석하여 답변하세요.\n\n" +
                                 "사용자 음성 명령 데이터: \"" + userMessage + "\"\n\n" +
                                 "[답변 규칙]\n" +
                                 "1. 사용자가 요구한 메뉴나 버튼이 이미지 상의 어떤 위치에 있는지 쉽게 설명하세요.\n" +
                                 "2. 절대 '누르세요', '클릭하세요' 터치 단어는 쓰지 말고, [요청하신 내용을 접수하여 로봇 조작 제어부로 전송합니다. 잠시만 기다려주세요]라는 확인 멘트를 마지막에 반드시 추가해 주세요.";

        try {
            // 🔥 여기도 구글 API 전송 규격 에러 전면 수정
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    contents: [{
                        parts: [
                            { text: voiceInstruction },
                            { inlineData: { mimeType: "image/jpeg", data: globalCapturedBase64 } }
                        ]
                    }]
                })
            });

            const result = await response.json();
            if (result.candidates && result.candidates[0].content.parts[0].text) {
                const aiResponseText = result.candidates[0].content.parts[0].text;
                resultBox.innerHTML = `[음성 인식 피드백]\n${aiResponseText}`;
                speak(aiResponseText); 
            } else {
                resultBox.innerHTML = "❌ 음성 명령 분석에 실패했습니다.";
            }
        } catch (error) {
            resultBox.innerHTML = "❌ AI 서버 연동 오류.";
        }
    }

    // 특수문자 및 기계음 완벽 제거 오디오 출력 함수
    function speak(text) {
        window.speechSynthesis.cancel();
        let cleanText = text.replace(/[^ㄱ-ㅎㅏ-ㅣ가-힣a-zA-Z0-9.\,\?\!\s]/g, "").trim();
        const speech = new SpeechSynthesisUtterance(cleanText);
        speech.lang = 'ko-KR';
        speech.rate = 0.95;
        window.speechSynthesis.speak(speech);
    }

    function stopAllSpeechAndRec() {
        window.speechSynthesis.cancel();
        if (recognition && isRecognizing) { try { recognition.stop(); } catch(e) {} }
        sttBox.style.display = "none";
        voiceArea.style.display = "none";
    }
</script>

</body>
</html>
